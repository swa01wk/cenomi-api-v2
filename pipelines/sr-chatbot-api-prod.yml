# Service Request Chatbot API — production build & deploy.
# Build context is service-request-chatbot/backend (Dockerfile lives there).
#
# Requires an Azure DevOps variable group "v2-ai-prod-vars" with:
#   api_repository   — container registry repository name for this image
#   docker_registry  — registry hostname (e.g. cenomiregistry.azurecr.io)
#   container_name   — Azure Container App name to deploy
#   app_url          — public base URL used for the post-deploy health check
#   AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID / AZURE_RG
# and a service connection named "CenomiRegistry" plus an environment named "CenomiProd".

trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'release-prod-ai-v2-api-*'

pr: none

pool:
  name: Azure Pipelines

variables:
  - group: v2-ai-prod-vars
  - name: SHORT_HASH
    value: ''
  - name: COMMIT_VER
    value: ''
  - name: IMAGE_BRANCH
    value: ''
  - name: IMAGE_TAG
    value: ''

parameters:
  - name: SourceBranch
    displayName: 'Source Branch (e.g. main, release, hotfix/x)'
    type: string
    default: 'main'

  # Do NOT use default: '' — ADO Run UI marks empty string as Required
  - name: CommitSHA
    displayName: 'Commit SHA (Optional — type "none" to deploy latest from SourceBranch)'
    type: string
    default: 'none'

  - name: ForceImagePushImageWithVulnerability
    type: boolean
    default: true
    displayName: Force Image Push Even With Vulnerability

stages:

- stage: DockerBuildAPI
  displayName: Build & Push API Image
  jobs:
  - job: Build
    steps:

    - checkout: self
      clean: true
      fetchDepth: 0
      persistCredentials: true

    - bash: |
        set -euo pipefail
        echo "Fetching remotes..."
        git fetch origin +refs/heads/*:refs/remotes/origin/* --prune
        git fetch origin --tags --force
      displayName: Fetch Remotes

    - bash: |
        set -euo pipefail

        echo "========================================="
        echo "Deployment Request"
        echo "========================================="
        echo "Build.Reason : $BUILD_REASON"
        echo "SourceBranch : $PARAM_SOURCE_BRANCH"
        echo "CommitSHA    : $PARAM_COMMIT_SHA"

        # Normalize — NO $(), NO $$, NO ${var#prefix} (ADO-safe)
        SOURCE_BRANCH=`echo "$PARAM_SOURCE_BRANCH" | sed 's|^refs/heads/||' | xargs`
        COMMIT_SHA=`echo "$PARAM_COMMIT_SHA" | xargs | tr '[:upper:]' '[:lower:]'`

        echo "Normalized SourceBranch : $SOURCE_BRANCH"
        echo "Normalized CommitSHA    : $COMMIT_SHA"

        #################################################################
        # Mode A — Automatic TAG trigger
        #################################################################
        if [[ "$BUILD_REASON" == "IndividualCI" || "$BUILD_REASON" == "BatchedCI" ]] && [[ "$BUILD_SOURCE_BRANCH" == refs/tags/* ]]; then
          MODE="tag"
          TARGET_SHA="$BUILD_SOURCE_VERSION"
          TAG_NAME=`echo "$BUILD_SOURCE_BRANCH" | sed 's|^refs/tags/||'`
          IMAGE_BRANCH=`echo "$TAG_NAME" | sed 's|/|-|g'`

          echo ""
          echo "Mode: Automatic Tag Trigger"
          echo "Tag : $TAG_NAME"
          echo "SHA : $TARGET_SHA"

          git cat-file -e "${TARGET_SHA}^{commit}" \
            || { echo "ERROR: Tagged commit not found: $TARGET_SHA"; exit 1; }

          git checkout "$TARGET_SHA"

        #################################################################
        # Mode B/C — Manual run using parameters
        #################################################################
        else
          if [ -z "$SOURCE_BRANCH" ]; then
            echo "ERROR: SourceBranch cannot be empty."
            exit 1
          fi

          echo ""
          echo "Validating branch origin/$SOURCE_BRANCH ..."
          if ! git show-ref --verify --quiet "refs/remotes/origin/$SOURCE_BRANCH"; then
            echo "ERROR: Branch '$SOURCE_BRANCH' not found on origin."
            exit 1
          fi

          IMAGE_BRANCH=`echo "$SOURCE_BRANCH" | sed 's|/|-|g'`

          if [ -z "$COMMIT_SHA" ] || [ "$COMMIT_SHA" = "none" ] || [ "$COMMIT_SHA" = "latest" ] || [ "$COMMIT_SHA" = "-" ]; then
            MODE="branch-latest"
            TARGET_SHA=`git rev-parse "origin/$SOURCE_BRANCH"`

            echo ""
            echo "Mode  : Latest commit on branch"
            echo "Branch: $SOURCE_BRANCH"
            echo "SHA   : $TARGET_SHA"

            git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"

          else
            MODE="branch-commit"
            TARGET_SHA="$COMMIT_SHA"

            echo ""
            echo "Mode  : Specific commit on branch"
            echo "Branch: $SOURCE_BRANCH"
            echo "SHA   : $TARGET_SHA"

            echo "Checking commit exists..."
            git cat-file -e "${TARGET_SHA}^{commit}" \
              || { echo "ERROR: Commit '$TARGET_SHA' does not exist."; exit 1; }

            echo "Checking commit belongs to origin/$SOURCE_BRANCH ..."
            if ! git merge-base --is-ancestor "$TARGET_SHA" "origin/$SOURCE_BRANCH"; then
              echo "ERROR: Commit '$TARGET_SHA' is NOT an ancestor of branch '$SOURCE_BRANCH'."
              echo "Refusing to deploy a commit from another branch."
              exit 1
            fi

            echo "SUCCESS: commit belongs to branch."
            git checkout "$TARGET_SHA"
          fi
        fi

        RESOLVED_SHA=`git rev-parse HEAD`
        SHORT_HASH=`echo "$RESOLVED_SHA" | cut -c1-8`
        AUTHOR=`git log -1 --pretty=%an`
        MESSAGE=`git log -1 --pretty=%s`
        IMAGE_TAG="$IMAGE_BRANCH-$SHORT_HASH"

        echo ""
        echo "===== Deployment Summary ====="
        echo "Mode       : $MODE"
        echo "Branch     : $SOURCE_BRANCH"
        echo "Target SHA : $RESOLVED_SHA"
        echo "SHORT_HASH : $SHORT_HASH"
        echo "IMAGE_TAG  : $IMAGE_TAG"
        echo "Author     : $AUTHOR"
        echo "Message    : $MESSAGE"
        echo "=============================="

        echo "##vso[task.setvariable variable=DEPLOY_MODE]$MODE"
        echo "##vso[task.setvariable variable=SOURCE_BRANCH]$SOURCE_BRANCH"
        echo "##vso[task.setvariable variable=TARGET_SHA]$RESOLVED_SHA"
        echo "##vso[task.setvariable variable=SHORT_HASH]$SHORT_HASH"
        echo "##vso[task.setvariable variable=IMAGE_BRANCH]$IMAGE_BRANCH"
        echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"

        echo "##vso[task.setvariable variable=DEPLOY_MODE;isOutput=true]$MODE"
        echo "##vso[task.setvariable variable=SOURCE_BRANCH;isOutput=true]$SOURCE_BRANCH"
        echo "##vso[task.setvariable variable=TARGET_SHA;isOutput=true]$RESOLVED_SHA"
        echo "##vso[task.setvariable variable=SHORT_HASH;isOutput=true]$SHORT_HASH"
        echo "##vso[task.setvariable variable=IMAGE_BRANCH;isOutput=true]$IMAGE_BRANCH"
        echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]$IMAGE_TAG"
      name: SelectSource
      displayName: Checkout Branch / Commit
      env:
        BUILD_REASON: $(Build.Reason)
        BUILD_SOURCE_BRANCH: $(Build.SourceBranch)
        BUILD_SOURCE_VERSION: $(Build.SourceVersion)
        PARAM_SOURCE_BRANCH: ${{ parameters.SourceBranch }}
        PARAM_COMMIT_SHA: ${{ parameters.CommitSHA }}

    - task: CmdLine@2
      displayName: Prepare Version
      inputs:
        script: |
          version_arg=$(git describe --tags --long --dirty 2>/dev/null)
          if [[ $version_arg =~ -[0-9]+-g[0-9a-f]{7,}$ ]]; then
            COMMIT_VER="$version_arg"
          else
            COMMIT_VER="UNKNOWN"
          fi
          echo "##vso[task.setvariable variable=COMMIT_VER]$COMMIT_VER"

    - task: Docker@2
      displayName: Build & Push Image
      inputs:
        containerRegistry: 'CenomiRegistry'
        repository: $(api_repository)
        command: 'buildAndPush'
        Dockerfile: 'service-request-chatbot/backend/Dockerfile'
        buildContext: 'service-request-chatbot/backend'
        tags: |
          $(IMAGE_TAG)
        arguments: >
          --platform linux/amd64
          --build-arg VERSION=$(COMMIT_VER)
          --build-arg GIT_SHA=$(SHORT_HASH)

    - task: CmdLine@2
      displayName: Docker Cleanup
      inputs:
        script: |
          disk_usage=$(df -h / | awk 'NR==2 {print $5}' | sed 's/%//')
          if [ $disk_usage -gt 80 ]; then
            echo "Cleaning Docker..."
            docker system prune -a -f
          else
            echo "Disk usage OK: $disk_usage%"
          fi

- stage: DeployAPI
  displayName: Deploy to Container App
  dependsOn: DockerBuildAPI
  variables:
    SHORT_HASH: $[ stageDependencies.DockerBuildAPI.Build.outputs['SelectSource.SHORT_HASH'] ]
    TARGET_SHA: $[ stageDependencies.DockerBuildAPI.Build.outputs['SelectSource.TARGET_SHA'] ]
    IMAGE_TAG: $[ stageDependencies.DockerBuildAPI.Build.outputs['SelectSource.IMAGE_TAG'] ]
    IMAGE_BRANCH: $[ stageDependencies.DockerBuildAPI.Build.outputs['SelectSource.IMAGE_BRANCH'] ]
    SOURCE_BRANCH: $[ stageDependencies.DockerBuildAPI.Build.outputs['SelectSource.SOURCE_BRANCH'] ]
    DEPLOY_MODE: $[ stageDependencies.DockerBuildAPI.Build.outputs['SelectSource.DEPLOY_MODE'] ]
  jobs:
  - deployment: Deploy
    environment: CenomiProd

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: CmdLine@2
            displayName: Verify Deploy Inputs
            inputs:
              script: |
                set -e
                echo "Deploy Mode   : $(DEPLOY_MODE)"
                echo "Source Branch : $(SOURCE_BRANCH)"
                echo "Target SHA    : $(TARGET_SHA)"
                echo "Short Hash    : $(SHORT_HASH)"
                echo "Image Tag     : $(IMAGE_TAG)"
                if [ -z "$(IMAGE_TAG)" ]; then
                  echo "ERROR: IMAGE_TAG is empty — build stage output missing"
                  exit 1
                fi

          - task: CmdLine@2
            displayName: Deploy Image
            inputs:
              script: |
                set -e

                # Use EXACT same IMAGE_TAG from Build (do NOT recalculate)
                IMAGE=$(docker_registry)/$(api_repository):$(IMAGE_TAG)

                echo "Deploying image: $IMAGE"

                az login --service-principal \
                  -u $(AZURE_CLIENT_ID) \
                  -p $(AZURE_CLIENT_SECRET) \
                  -t $(AZURE_TENANT_ID)

                az account set --subscription $(AZURE_SUBSCRIPTION_ID)

                az containerapp update \
                  --name $(container_name) \
                  --resource-group $(AZURE_RG) \
                  --image "$IMAGE"

          - task: CmdLine@2
            displayName: Wait for Revision Healthy
            inputs:
              script: |
                set -e

                echo "Waiting for revision..."

                for i in {1..30}; do
                  state=$(az containerapp revision list \
                    --resource-group $(AZURE_RG) \
                    --name $(container_name) \
                    --query "[0].properties.runningState" -o tsv)

                  echo "Current state: $state"

                  if [ "$state" == "Running" ]; then
                    echo "Revision is running"
                    exit 0
                  elif [ "$state" == "Failed" ]; then
                    echo "Revision failed"
                    exit 1
                  fi

                  sleep 10
                done

                echo "Timeout waiting for revision"
                exit 1

          - task: CmdLine@2
            displayName: Health Check
            inputs:
              script: |
                set -e

                echo "Checking health endpoint..."

                for i in {1..10}; do
                  code=$(curl -s -o /dev/null -w "%{http_code}" $(app_url)/api/v1/health)

                  if [ "$code" = "200" ]; then
                    echo "Health check passed"
                    exit 0
                  fi

                  echo "Retrying... ($i)"
                  sleep 5
                done

                echo "Health check failed"
                exit 1
