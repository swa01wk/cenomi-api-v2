[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "service-request-chatbot-api"
version = "0.1.0"
description = "FastAPI backend for Service Request Chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "langgraph>=0.2.40",
    "alembic>=1.13.0",
    "openai>=1.54.0",
    "httpx>=0.27.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "litellm>=1.40.0,<2.0.0",
]

[project.optional-dependencies]
# Google Cloud Vertex AI — required when LLM_PROVIDER=vertex_ai or EMBEDDING_PROVIDER=vertex_ai.
# Install with: pip install "service-request-chatbot-api[vertex_ai]"
vertex_ai = [
    "google-genai>=1.0.0",
]

# Installs every optional provider extra (convenient for full deployments).
# Install with: pip install "service-request-chatbot-api[all]"
all = [
    "google-genai>=1.0.0",
]

# RAG knowledge indexer job (ticket 3547) — installed ONLY in the indexer
# image (Dockerfile.indexer: pip install ".[indexer]").  The API image stays
# on the lean base install.
indexer = [
    "tiktoken>=0.7.0",
    "beautifulsoup4>=4.12.3",
    "azure-search-documents>=11.6.0",
    "pdfplumber>=0.11.0",
    "azure-storage-blob>=12.20.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",  # required by openai.APIError in tests
    # Indexer transform deps so tests/unit/indexer runs without the full
    # [indexer] extra (the Azure SDKs stay lazy-imported and stubbed).
    "tiktoken>=0.7.0",
    "beautifulsoup4>=4.12.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
